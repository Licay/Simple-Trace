name: rc / Build

on:
  # 手动触发工作流
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Linux Kernel Version (e.g., v5.15.0)'
        required: true
        default: 'v6.15'
      arch:
        description: 'Architecture (e.g., x86_64, arm64)'
        required: true
        default: 'x86_64'
  push:
    branches:
      - wkf-test
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Show current kernel version
        run: uname -r

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up env
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc git build-essential libncurses-dev flex bison libssl-dev libelf-dev bc cpio xz-utils curl zsh

      - name: Clone Linux kernel
        run: |
          git clone https://github.com/torvalds/linux.git kernel --depth 1 --branch ${{ github.event.inputs.kernel_version || 'v6.6' }} 
          # git clone https://android.googlesource.com/kernel/msm kernel --depth 1 --branch main
          cd kernel
          echo "Linux kernel $(make kernelversion) cloned"

      - name: Cache prebuilts
        id: cache-prebuilts
        uses: actions/cache@v4.2.3
        with:
          path: ~/prebuilts
          key: ${{ runner.os }}-prebuilts-aarch64
          restore-keys: |
            ${{ runner.os }}-prebuilts-

      - name: Config kernel
        run: |
          KERNEL_DIR=./kernel BRANCH=rc sh -c "$(curl -fsSL https://github.com/Licay/Simple-Trace/raw/refs/heads/rc/tools/setup.sh)"

      - name: Setup build script
        run: |
          wget https://raw.githubusercontent.com/Licay/misc_files/refs/heads/main/scripts/kernel_mk.sh
          sed -i '/PREBUILTS_DIR=/a\PREBUILTS_DIR=~/prebuilts' kernel_mk.sh
          echo "CONFIG_SIMPLE_TRACE=m" >> `pwd`/.github/workflows/configs/qemu_arm64_userdebug_virt.config
          echo "CONFIG_SIMPLE_TRACE_USE_TIME=y" >>`pwd`/.github/workflows/configs/qemu_arm64_userdebug_virt.config
          echo "CONFIG_SIMPLE_LOOKUP_NAME=m" >> `pwd`/.github/workflows/configs/qemu_arm64_userdebug_virt.config
          # echo "m CONFIG_SIMPLE_TRACE=m CONFIG_SIMPLE_TRACE_USE_TIME=y CONFIG_SIMPLE_LOOKUP_NAME=m olddefconfig; echo "--- show test configs"; cat wk/out/.config | grep CONFIG_SIMPLE; mk" >> kernel_mk.sh
          echo "m olddefconfig; echo "--- show test configs"; cat wk/out/.config | grep CONFIG_SIMPLE; mk" >> kernel_mk.sh

      - name: Build kernel module
        run: |
          echo "setup=1 WORK_DIR=`pwd`/wk source kernel_mk.sh `pwd`/kernel `pwd`/.github/workflows/configs/qemu_arm64_userdebug_virt.config"
          setup=1 WORK_DIR=`pwd`/wk source kernel_mk.sh `pwd`/kernel `pwd`/.github/workflows/configs/qemu_arm64_userdebug_virt.config
          du -h -d 1 ~/prebuilts*
          # make -C kernel O=out defconfig
          # echo "CONFIG_SIMPLE_TRACE=m" >> kernel/.config
          # echo "CONFIG_SIMPLE_TRACE_LOGSIZE_SHIFT=12" >> kernel/.config
          # echo "CONFIG_SIMPLE_TRACE_USE_TIME=y" >> kernel/.config
          # echo "CONFIG_SIMPLE_LOOKUP_NAME=m" >> kernel/.config
          # make -C kernel O=out -j`nproc`
          # make CONFIG_SIMPLE_TRACE=m CONFIG_SIMPLE_TRACE_USE_TIME=y CONFIG_SIMPLE_LOOKUP_NAME=m -C kernel O=out -j`nproc`
          echo "now find ko..."
          find ./wk/out -name "simple*.ko"
          cp `find ./wk/out -name "simple*.ko"` ./
          # mv simple_trace.ko simple_trace-${{ matrix.kernel }}.ko
          # mv simple_lookup_name.ko simple_lookup_name-${{ matrix.kernel }}.ko
          mv wk/out/arch/arm64/boot/Image ./
        shell: bash

      - name: Upload module as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-modules
          path: |
            simple_trace*.ko
            simple_lookup_name*.ko
            Image
